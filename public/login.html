<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Simple POS</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f1f5fb; color: #0f172a; font-size: 13px; }
      .hidden { display: none; }
      .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .login-card {
        width: 100%; max-width: 330px; background: #fff; border: 1px solid #ced8e8; border-radius: 8px;
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.08); padding: 16px;
      }
      .logo-box { text-align: center; margin-bottom: 14px; }
      .logo-icon { font-size: 30px; }
      .logo-title { font-size: 19px; font-weight: 700; color: #1d3f72; margin: 4px 0; }
      .logo-sub { font-size: 12px; color: #64748b; }
      input, button, select { width: 100%; padding: 8px 10px; margin: 4px 0; border-radius: 4px; border: 1px solid #c5d2e3; }
      button { border: 0; background: #2b6fd6; color: #fff; cursor: pointer; font-weight: 600; border-radius: 4px; }
      button:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <div id="loginPage" class="login-wrap">
      <div class="login-card">
        <div class="logo-box">
          <div class="logo-icon">🏪</div>
          <div class="logo-title">RetailEdge POS</div>
          <div class="logo-sub">POS System</div>
        </div>
        <input id="username" placeholder="Username" value="admin" />
        <input id="password" type="password" placeholder="Password" value="admin123" />
        <select id="roleHint">
          <option value="">Select Role</option>
          <option>Admin</option>
          <option>Cashier</option>
          <option>Customer</option>
        </select>
        <button onclick="login()">Login</button>
        <p style="font-size:12px;color:#64748b;margin:8px 0 0;">Default users: admin/admin123, cashier/cashier123, customer/customer123</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
